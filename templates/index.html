<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FoldNote</title>
<meta name="description" content="Anteckningar där varje stycke kan ha flera alternativa formuleringar.">
<meta name="theme-color" content="#14110D" id="themeColorMeta">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/css/style.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FoldNote">
<script>
  // Sätter temat före första målningen, annars blinkar fel tema förbi.
  (function () {
    try {
      var mode = localStorage.getItem("foldnote-theme") || "auto";
      var h = new Date().getHours();
      document.documentElement.dataset.theme =
        mode === "auto" ? (h >= 19 || h < 7 ? "dark" : "light") : mode;
      document.documentElement.dataset.themeMode = mode;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
</head>
<body>

<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">Fold<span>Note</span></div>

    <button class="btn btn-primary btn-new" id="newNote" type="button">Ny anteckning</button>

    <div class="note-list" id="noteList"></div>
    <p class="list-empty" id="listEmpty" hidden>Inga anteckningar än.</p>

    <div class="sidebottom">
      <button class="btn btn-quiet theme-btn" id="themeBtn" type="button"></button>
      <a class="btn btn-quiet" href="/api/export" download>Exportera</a>
      <button class="btn btn-quiet" id="importBtn" type="button">Importera</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" id="menuBtn" type="button" aria-label="Visa anteckningar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="titles" id="titles" hidden>
        <input id="title" class="title-input" placeholder="Namnlös anteckning" maxlength="200">
        <input id="tags" class="tags-input" placeholder="Taggar" maxlength="200">
      </div>

      <span class="status" id="status" aria-live="polite"></span>

      <button class="btn btn-icon btn-danger" id="deleteNote" type="button" aria-label="Ta bort anteckningen" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
      </button>
    </header>

    <section class="empty" id="empty">
      <div class="empty-inner">
        <h1>Skriv först. Formulera om sen.</h1>
        <p>Varje stycke kan bära flera formuleringar samtidigt, sida vid sida, tills du vet vilken som var bäst.</p>
        <button class="btn btn-primary" id="emptyNew" type="button">Skapa en anteckning</button>
      </div>
    </section>

    <section class="editor" id="editor" hidden>
      <div class="segments" id="segments"></div>
      <button class="add-segment" id="addSegment" type="button">Lägg till stycke</button>
    </section>
  </main>
</div>

<template id="segmentTpl">
  <article class="segment">
    <div class="seg-original">
      <div class="seg-head">
        <span class="seg-number"></span>
        <button class="btn btn-text btn-danger seg-remove" type="button">Ta bort stycket</button>
      </div>
      <textarea class="ta original" placeholder="Skriv stycket här …" rows="1"></textarea>
    </div>
    <div class="seg-versions">
      <div class="versions"></div>
      <button class="btn btn-text add-version" type="button">Lägg till formulering</button>
    </div>
  </article>
</template>

<template id="versionTpl">
  <div class="version">
    <div class="version-head">
      <input class="version-label" placeholder="Namnlös" maxlength="60" aria-label="Namn på formuleringen">
      <button class="btn btn-icon btn-danger version-remove" type="button" aria-label="Ta bort formuleringen">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <textarea class="ta version-text" placeholder="Alternativ formulering …" rows="1"></textarea>
  </div>
</template>

<script src="/static/js/app.js"></script>
</body>
</html>
