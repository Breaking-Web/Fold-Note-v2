<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anteckningar</title>
<meta name="description" content="Anteckningsapp där varje stycke kan ha flera alternativa versioner.">
<meta name="theme-color" content="#0d0d0c" id="theme-color-meta">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anteckningar">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  // Sätter tema INNAN CSS:en målas upp, så det inte blinkar till i fel tema.
  (function () {
    try {
      var saved = localStorage.getItem("theme-preference") || "auto";
      function computeAuto() {
        var h = new Date().getHours();
        return (h >= 19 || h < 7) ? "dark" : "light";
      }
      var applied = saved === "auto" ? computeAuto() : saved;
      document.documentElement.setAttribute("data-theme", applied);
      document.documentElement.setAttribute("data-theme-mode", saved);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13"/><path d="M6 21a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2h12v4H6Z"/></svg>
        </span>
        <span class="brand-name">Anteckningar</span>
      </div>
      <div class="header-actions">
        <button id="install-btn" class="icon-btn install-btn hidden" type="button" title="Installera appen" aria-label="Installera appen">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" type="button" data-mode="auto" title="Byt tema">
          <svg class="icon-light" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-dark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          <svg class="icon-auto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <div class="app-layout" id="app-layout">
      <section class="panel panel-list" id="panel-list" aria-label="Anteckningslista">
        <div class="list-toolbar">
          <h1 class="list-title">Mina anteckningar</h1>
        </div>
        <div class="notes-list" id="notes-list"></div>
        <div class="empty-state hidden" id="empty-state">
          <p>Inga anteckningar än.</p>
          <p>Tryck på plusknappen för att skapa din första.</p>
        </div>
      </section>

      <section class="panel panel-detail" id="panel-detail" aria-label="Anteckning">
        <div class="detail-placeholder" id="detail-placeholder">
          <p>Välj en anteckning i listan, eller skapa en ny.</p>
        </div>

        <div class="note-editor hidden" id="note-editor">
          <div class="editor-toolbar">
            <button class="icon-btn back-btn" id="back-btn" type="button" aria-label="Tillbaka till listan">
              <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <input type="text" id="note-title-input" class="note-title-input" placeholder="Namnlös anteckning" maxlength="200">
            <span class="save-indicator" id="save-indicator"></span>
            <button class="icon-btn danger" id="delete-note-btn" type="button" aria-label="Ta bort anteckning">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
            </button>
          </div>

          <div class="blocks-container" id="blocks-container"></div>

          <button class="add-block-btn" id="add-block-btn" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Lägg till stycke
          </button>
        </div>
      </section>
    </div>

    <button class="fab" id="fab-new-note" type="button" aria-label="Ny anteckning">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
